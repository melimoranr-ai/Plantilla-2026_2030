<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard de Admisiones 2026–2030</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style id="st">
:root{--bg:#FFFFFF;--card:#fff;--tx:#2B2B24;--mut:#6B6B5E;--line:#E2E0D2;--zero:#E4E2D4;--g:#196B24;--o:#FF8427;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#196B24;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(100deg,#013E00,#196B24 60%,#46962A);color:#fff;padding:12px 16px 10px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.sub{font-size:12px;opacity:.8}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
nav button,.btn{border:0;border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav button{background:rgba(255,255,255,.14);color:#fff}
nav button.on{background:#FF8427;color:#1c1200;font-weight:700}
.btn{background:#FF8427;color:#1c1200;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px;text-transform:uppercase;letter-spacing:.4px}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);max-width:210px}
.chip{background:#FF8427;color:#1c1200;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}
.link{background:none;border:0;color:var(--g);cursor:pointer;font:inherit;text-decoration:underline;padding:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid #46962A;border-radius:12px;padding:10px 14px}
.kpi:nth-child(even){border-left-color:#FF8427}
.kpi b{display:block;font-size:24px;line-height:1.15}
.kpi span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;grid-auto-flow:dense}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:14px}
.cv{position:relative;height:270px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
@media(min-width:900px){.wide{grid-column:span 2}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
.srow{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;align-items:flex-start;padding:2px 2px 8px;scrollbar-width:thin;scrollbar-color:#B9C9B0 transparent}
.srow::-webkit-scrollbar{height:8px}.srow::-webkit-scrollbar-thumb{background:#B9C9B0;border-radius:4px}
.sl{flex:0 0 156px;background:#fff;border:1px solid #E1E7DC;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,60,20,.08)}
.sl.lw{flex:0 0 250px}
.sl h4{margin:0;display:flex;justify-content:space-between;align-items:center;padding:5px 6px 5px 10px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#196B24;background:linear-gradient(#F6FAF3,#EDF4E8);border-bottom:1px solid #E1E7DC}
.sl h4 .ic{display:flex;align-items:center}.sl h4 svg{width:14px;height:14px;display:block}
.sl .mi{display:none}
.sl .x{border:0;background:none;cursor:pointer;padding:2px;border-radius:5px;display:flex;color:#6B7A62}
.sl .x:hover:not(:disabled){background:#DDE8D5}.sl .x:disabled{opacity:.28;cursor:default}
.sb{max-height:150px;overflow-y:auto;padding:6px;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.sl[data-k=e] .sb{max-height:210px}
.sb button{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;text-align:left;border:1px solid transparent;background:#F1F6EE;color:#26331F;padding:3px 6px;border-radius:6px;margin:0;cursor:pointer;font:inherit;font-size:11px;line-height:1.15;min-height:24px;overflow-wrap:break-word;word-break:normal;hyphens:none;transition:background .12s}
.sb button em{font-style:normal;color:#7C8A72;font-size:10px;flex:0 0 auto;margin-left:auto;padding-left:4px}
.sb button:hover{background:#DDEBD2}
.sb button.on{background:linear-gradient(#4FA32F,#3C8A24);color:#fff;box-shadow:0 1px 2px rgba(20,60,20,.25)}.sb button.on em{color:#E6F3DC}
.sb button.z:not(.on){background:#F6F6F4;color:#B4B8AF}.sb button.z:not(.on) em{color:#C9CCC5}
.sb::-webkit-scrollbar{width:6px}.sb::-webkit-scrollbar-thumb{background:#C5D3BC;border-radius:3px}
.ht{border-collapse:separate;border-spacing:3px}.ht td{padding:7px 10px;border-radius:5px;border:0;text-align:center;min-width:44px}.ht th{position:static;background:none}
.tm{position:relative;height:380px}.tm>div{position:absolute;padding:2px}.tm i{display:block;height:100%;border-radius:6px;padding:6px 8px;color:#fff;overflow:hidden;font-style:normal;font-size:12px}.tm b{display:block;font-weight:600;line-height:1.2}.tm>div:first-child i{color:#1c1200}
.map{width:100%;height:auto;max-height:380px;display:block}
.map path{stroke:var(--card);stroke-width:1.2;stroke-linejoin:round;cursor:pointer;transition:opacity .15s}
.map path:hover{opacity:.78}
.lg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:6px}
.lg i{flex:0 0 120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#D6EBC6,#196B24)}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.fbar .mut{flex:1 1 300px;margin:0;font-size:11px}
.mut{font-size:12px;color:var(--mut);margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#013E00;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90vw;display:none}
#tip{position:fixed;pointer-events:none;background:#013E00;color:#fff;padding:4px 9px;border-radius:8px;font-size:12px;display:none;z-index:20}
</style></head>

function treemap(en){en=en.filter(e=>e[1]>0);if(!en.length)return EMP;const o=[];(function sp(a,x,y,w,h){if(a.length==1){o.push([a[0],x,y,w,h]);return}const tot=a.reduce((s,e)=>s+e[1],0);let acc=0,i=0;while(i<a.length-1&&acc+a[i][1]<=tot/2)acc+=a[i++][1];if(!i){acc=a[0][1];i=1}const f=acc/tot;if(w>=h){sp(a.slice(0,i),x,y,w*f,h);sp(a.slice(i),x+w*f,y,w*(1-f),h)}else{sp(a.slice(0,i),x,y,w,h*f);sp(a.slice(i),x,y+h*f,w,h*(1-f))}})(en,0,0,100,100);return `<div class="tm">${o.map(([e,x,y,w,h],j)=>`<div style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"><i style="background:${j==0?O0:j%2?"#46962A":"#196B24"}" title="${qt(e[0])}: ${e[1]}"><b>${e[0]}</b>${fmt(e[1])}</i></div>`).join("")}</div>`}
function chart(cfg,ht){const id="c"+CH.length;CH.push(cfg);return `<div class="cv"${ht?` style="height:${ht}px"`:""}><canvas id="${id}"></canvas></div>`}
function bars(ents,type,hi){
  if(!ents.length)return `<div class="empty">Sin datos con estos filtros</div>`;
  const hiI=hi===undefined?ents.map(e=>e[1]).indexOf(Math.max(...ents.map(e=>e[1]))):hi;
  return chart({t:type,l:ents.map(e=>type=="m"?mlab(e[0]):e[0]),d:ents.map(e=>e[1]),hi:hiI},type=="h"?Math.max(320,ents.length*40+70):(type=="hist"?340:(type=="pa"?400:0)));
}
function group(labels,series,o={}){
  if(!series.some(s=>s.d.some(v=>v)))return `<div class="empty">Aún no hay datos capturados en esta sección</div>`;
  return chart({t:"g",l:labels,s:series,st:o.st,hz:o.hz,ln:o.ln});
}

  const out=[...m].filter(([n])=>!PATHS.some(p=>p[0]==n)).map(([n,v])=>n+" "+v).join(" · ");
  return `<div class="card wide"><h3>${title}</h3><svg class="map" viewBox="${VB}">${ps}</svg><div class="lg">menos<i></i>más (máx. ${fmt(mx)})</div>${out?`<div class="mut">Fuera del mapa: ${out}</div>`:""}</div>`;
}

  }
  if(tab=="sp"){
    const fy=r=>!F.spy||!F.spy.size||F.spy.has(String(r[0])), fp=r=>!F.spp||!F.spp.size||F.spp.has(r[1]);

      +card("Enfermería: resultado por año",group(E.map(r=>r[0]),[{n:"Aplicantes",c:"#196B24",d:E.map(r=>r[1]||0)},{n:"Aceptados",c:G0,d:E.map(r=>r[2]||0)},{n:"Rechazados",c:O0,d:E.map(r=>r[3]||0)},{n:"Lista de espera",c:"#FEA300",d:E.map(r=>r[4]||0)},{n:"No se presentaron",c:"#8A8A6E",d:E.map(r=>r[5]||0)}]),1);

function setTab(t){tab=t;F={};SEL.clear();$("#tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k==tab?"on":""}">${v}</button>`).join("");buildFilters();render()}

document.addEventListener("mousemove",e=>{const p=e.target.closest&&e.target.closest("path[data-s]"),t=$("#tip");
  if(p){t.style.display="block";t.style.left=e.clientX+12+"px";t.style.top=e.clientY+12+"px";t.textContent=p.dataset.s+": "+fmt(+p.dataset.v)}else t.style.display="none"});
// Carga de un Excel actualizado (mismas hojas y columnas que el archivo limpio)
const S=v=>typeof v=="string"?v.replace(/\s+/g," ").trim():(v==null?"":v), N=v=>typeof v=="number"?v:parseFloat(v)||0;
function iso(v){if(!(v instanceof Date)||isNaN(v))return null;const d=new Date(v.getTime()+43200000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function rd(wb,n){const ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{defval:null}).map(r=>{const o={};for(const k in r)o[k.trim().toLowerCase()]=r[k];return o}):[]}
const hr=v=>v instanceof Date?new Date(v.getTime()+30000).getHours():(typeof v=="number"?Math.floor(v*24)%24:null);
const enc=v=>S(v).replace(/^(Crhistian|Cristian)$/,"Christian");

// ---- Persistencia: al subir un Excel, la página se republica a sí misma con los datos nuevos incrustados ----
const toast=(m,ms=6000)=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",ms)};
function buildDoc(data){
  const sc=document.getElementById("app").textContent, mD="const DATA=/*"+"D*/", i=sc.indexOf(mD)+mD.length, j=sc.indexOf("/*"+"E*/");
  const ns=sc.slice(0,i)+JSON.stringify(data)+sc.slice(j);
  const b=document.body.cloneNode(true);
  ["tabs","filters","kpis","grid","upd","tip","toast","upbtn"].forEach(id=>{const e=b.querySelector("#"+id);if(e){if(id!="upbtn")e.innerHTML="";e.removeAttribute("style")}});
  b.querySelector("#app").remove();
  return "<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dashboard de Admisiones 2026–2030</title>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<style id=\"st\">"+document.getElementById("st").textContent+"</style></head>\n<body>"+b.innerHTML+"<script id=\"app\">"+ns+"<\/script></body></html>";
}
async function persist(data){
  try{
    const A=window.claude&&claude.use?await claude.use("artifact"):null;
    if(!A){const u=URL.createObjectURL(new Blob([buildDoc(data)],{type:"text/html"}));const t=$("#toast");t.innerHTML='Datos cargados. Para dejarlos fijos para todos: <a href="'+u+'" download="index.html" style="color:#FFB866;font-weight:700">descarga el index.html actualizado</a> y súbelo a GitHub reemplazando el anterior.';t.style.display="block";clearTimeout(toast.t);return}
    toast("Guardando datos para todos los que tengan el enlace…",15000);
    await A.publish(buildDoc(data));
  }catch(err){
    const c=err&&err.code;
    if(c=="conflict")return;
    toast(c=="not_writer"||c=="not_granted"?"Datos cargados solo para ti: no tienes permiso de edición para guardarlos en el enlace.":"No se pudieron guardar los datos: "+((err&&err.message)||err));
  }
}
async function gate(){try{const u=window.claude&&claude.use?await claude.use("user"):null;if(u&&u.canEdit&&u.canEdit()===false)$("#upbtn").style.display="none"}catch(e){}}
gate();
file.addEventListener("change",async e=>{
  try{const wb=XLSX.read(await e.target.files[0].arrayBuffer(),{cellDates:true});
    const col=rd(wb,"COLEGIOS").map(r=>[S(r.colegios),N(r["número de asistentes"]),iso(r["fecha de asistencia (día/mes/año)"]||r.fecha),S(r.estado),enc(r.encargado)]).filter(r=>r[2]&&r[0]);
    const cit=rd(wb,"CITAS").map(r=>[iso(r.fecha),S(r["periodo de interes"]),S(r["carrera de interes"]),S(r["escuela a la que pertenece"]),S(r.modalidad),hr(r["hora de la cita"])]).filter(r=>r[0]);
    const ate=rd(wb,"ATENCIONES").map(r=>[iso(r.fecha),S(r.ciudad),S(r.estado),S(r["preparatoria de origen"]),enc(r.encargado),S(r["carrera de interes"]),S(r["periodo de interes"])]).filter(r=>r[0]);
    if(!col.length&&!cit.length&&!ate.length)return alert("No encontré las hojas COLEGIOS, CITAS o ATENCIONES con datos.");
    const sp=rd(wb,"SEMANA PRE").filter(r=>r["año"]).map(r=>[r["año"],S(r.periodo),r.asistentes,r["total inscritos"],r["no inscritos"]]);
    const en=rd(wb,"ENFERMERÍA").filter(r=>r["año"]).map(r=>[r["año"],r.aplicantes,r.aceptados,r.rechazados,r["lista de espera"],r["no se presentaron"]]);
    load({col,cit,ate,sp,en});stamp();setTab(tab);e.target.value="";persist({col,cit,ate,sp,en});
  }catch(err){alert("No pude leer el archivo: "+err.message)}
});
function stamp(){const f=[...D.col,...D.cit,...D.ate].map(r=>r.f).sort().pop();$("#upd").textContent="Datos hasta el "+(f?f.split("-").reverse().join("/"):"—")+" · "+fmt(D.col.length)+" visitas, "+fmt(D.cit.length)+" citas, "+fmt(D.ate.length)+" atenciones"}
load(DATA);stamp();setTab("res");
})();
